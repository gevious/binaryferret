# Build the release binaries scripts/install.sh downloads: static musl builds
# for Linux and Darwin builds for macOS, one asset per target triple, named
# byteferret-<triple>.tar.gz with the `byteferret` binary at the archive root.
#
# Runs when a version tag (v*) is pushed and attaches the assets to that tag's
# GitHub release (creating it if needed).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf byteferret-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release byteferret

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: byteferret-${{ matrix.target }}.tar.gz
